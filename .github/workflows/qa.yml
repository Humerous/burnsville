name: Burnsville QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Verify current product authority
        run: node qa/product-authority.mjs

      - name: Verify approved bottle assets
        run: npm run qa:product-assets

      - name: Verify approved card assets
        run: npm run qa:product-cards

      - name: Verify catalogue readiness
        run: npm run qa:catalogue

      - name: Test catalogue validator
        run: npm run test:catalogue-validator

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --include=dev

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name burnsville-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec burnsville-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; then break; fi
            sleep 2
          done
          docker exec burnsville-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in {1..30}; do
            if docker exec burnsville-mongo mongosh --quiet --eval "rs.status().myState" | grep -q 1; then break; fi
            sleep 2
          done

      - name: Seed current-only QA database
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/burnsville_qa?replicaSet=rs0
          NODE_ENV: test
        run: npm run qa:setup-current-db

      - name: Start API test runtime
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/burnsville_qa?replicaSet=rs0
          JWT_SECRET: burnsville-ci-only-secret
          NODE_ENV: test
          PORT: '5001'
        run: |
          node backend/server.js > /tmp/burnsville-api.log 2>&1 &
          echo $! > /tmp/burnsville-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/api/products > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/burnsville-api.log
          exit 1

      - name: Run exact current catalogue API QA
        env:
          BASE_URL: http://127.0.0.1:5001
        run: npm run qa:product-catalogue-api

      - name: Run integrated API QA
        env:
          BASE_URL: http://127.0.0.1:5001
        run: node qa/integrated-api.mjs

      - name: Run heat-filter API QA
        env:
          BASE_URL: http://127.0.0.1:5001
          MONGO_URI: mongodb://127.0.0.1:27017/burnsville_qa?replicaSet=rs0
          BURNSVILLE_QA_HEAT_FILTER: '1'
        run: node qa/heat-filter-api.mjs

      - name: Run review consistency QA
        env:
          BASE_URL: http://127.0.0.1:5001
        run: node qa/review-consistency.mjs

      - name: Run functional API QA
        env:
          BASE_URL: http://127.0.0.1:5001
        run: node qa/functional-api.mjs

      - name: Restart in production mode
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/burnsville_qa?replicaSet=rs0
          JWT_SECRET: burnsville-ci-only-secret
          NODE_ENV: production
          PORT: '5001'
        run: |
          kill "$(cat /tmp/burnsville-server.pid)"
          wait "$(cat /tmp/burnsville-server.pid)" 2>/dev/null || true
          node backend/server.js > /tmp/burnsville-production.log 2>&1 &
          echo $! > /tmp/burnsville-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/burnsville-production.log
          exit 1

      - name: Run production serving QA
        env:
          BASE_URL: http://127.0.0.1:5001
        run: node qa/production-static.mjs

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/burnsville-server.pid ]; then kill "$(cat /tmp/burnsville-server.pid)" 2>/dev/null || true; fi
          docker rm -f burnsville-mongo 2>/dev/null || true
