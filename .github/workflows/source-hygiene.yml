name: Source Hygiene Sweep

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Clean source comments
        run: |
          find backend frontend/src -type f \( -name '*.js' -o -name '*.jsx' \) -print0 | xargs -0 perl -0pi -e 's/^[ \t]*\/\/[ \t]*<----[^\n]*\n?//mg; s/\n{3,}/\n\n/g; s/[ \t]+\n/\n/g'
          perl -0pi -e 's/This Preview keeps the order unpaid/This portfolio build keeps the order unpaid/g' frontend/src/screens/OrderScreen.jsx
          rm .github/workflows/source-hygiene.yml

      - name: Verify source hygiene
        run: |
          if git grep -n '<----' -- backend frontend/src; then
            exit 1
          fi
          if git grep -n 'This Preview keeps' -- frontend/src; then
            exit 1
          fi
          git diff --check

      - name: Commit source hygiene
        run: |
          git config user.name "David Miller"
          git config user.email "chameleonunicodestudios@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: complete source hygiene sweep"
          git push origin main
