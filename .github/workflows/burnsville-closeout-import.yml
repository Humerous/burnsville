name: Burnsville Closeout Import

on:
  push:
    branches:
      - modernise/burnsville-v2
    paths:
      - '.closeout/**'

permissions:
  contents: write

jobs:
  import-final-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: modernise/burnsville-v2
          fetch-depth: 0

      - name: Restore audited text package
        shell: bash
        run: |
          cat .closeout/payload.part-* | base64 --decode > /tmp/burnsville-closeout.tar.gz
          tar -xzf /tmp/burnsville-closeout.tar.gz -C .

      - name: Download and verify approved product cards
        shell: bash
        run: |
          mkdir -p frontend/public/images/products/cards
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          (async () => {
            const map = JSON.parse(
              fs.readFileSync('backend/data/burnsville-product-card-asset-map.json', 'utf8')
            );

            for (const asset of map.assets) {
              const url = `https://burnsville-current.vercel.app${asset.path}`;
              const response = await fetch(url);

              if (!response.ok) {
                throw new Error(`Download failed for ${asset.filename}: HTTP ${response.status}`);
              }

              const data = Buffer.from(await response.arrayBuffer());
              const digest = crypto.createHash('sha256').update(data).digest('hex');

              if (digest !== asset.sha256) {
                throw new Error(
                  `SHA-256 mismatch for ${asset.filename}: expected ${asset.sha256}, got ${digest}`
                );
              }

              const destination = path.join(
                'frontend/public/images/products/cards',
                asset.filename
              );
              fs.writeFileSync(destination, data);
              console.log(`Verified ${asset.filename}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run closeout source QA
        shell: bash
        run: |
          node qa/product-authority.mjs
          node qa/product-assets.mjs
          node qa/product-card-assets.mjs
          node qa/catalogue-readiness.mjs
          node qa/catalogue-readiness.test.mjs
          git diff --check

      - name: Commit final Burnsville source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .closeout
          git rm .github/workflows/burnsville-closeout-import.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: close Burnsville current build"
          git push origin HEAD:modernise/burnsville-v2
