<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Burnsville — Turn up the heat. Keep the flavour.</title>
  <desc id="desc">Clean cream and dark Burnsville repository showcase using the same wordmark treatment as the live website.</desc>

  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.62" stop-color="#f3ede4"/>
      <stop offset="1" stop-color="#eadfce"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181411"/>
      <stop offset="0.56" stop-color="#111111"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="sauce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#df4b28"/>
      <stop offset="0.48" stop-color="#b8231b"/>
      <stop offset="1" stop-color="#74140f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.55" cy="0.48" r="0.55">
      <stop offset="0" stop-color="#d2282b" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#c82029" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c82029" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#cream)"/>
  <path d="M1040 0H1600V900H720Z" fill="url(#dark)"/>
  <path d="M1072 0H1100L782 900H752Z" fill="#d2282b" opacity="0.78"/>
  <circle cx="1260" cy="438" r="330" fill="url(#halo)"/>

  <!-- Left: website-aligned brand lockup -->
  <g transform="translate(118 118)">
    <text x="0" y="62" fill="#b8231b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" letter-spacing="4">CHAMELEON UNICODE STUDIOS</text>

    <text x="0" y="220" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Narrow', sans-serif" font-size="126" font-weight="900" letter-spacing="4">BURNSVILLE</text>

    <g transform="translate(6 250)">
      <rect x="0" y="18" width="154" height="4" fill="#d2282b"/>
      <text x="185" y="29" fill="#b8231b" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Narrow', sans-serif" font-size="31" font-weight="900" letter-spacing="8">HOT SAUCE</text>
      <rect x="426" y="18" width="154" height="4" fill="#d2282b"/>
    </g>

    <text x="0" y="360" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">TURN UP THE <tspan fill="#b8231b">HEAT.</tspan></text>
    <text x="0" y="408" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">KEEP THE FLAVOUR.</text>

    <line x1="0" y1="458" x2="650" y2="458" stroke="#b9aa99" stroke-width="2"/>

    <text x="0" y="515" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="2">16 PRODUCT COLLECTION</text>
    <text x="0" y="557" fill="#6e6156" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">10 CORE <tspan fill="#b8231b">|</tspan> 6 LIMITED / VINTAGE</text>

    <g transform="translate(0 616)">
      <rect x="0" y="0" width="132" height="52" rx="13" fill="#111111"/>
      <text x="66" y="33" text-anchor="middle" fill="#f3ede4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">REACT</text>

      <rect x="146" y="0" width="132" height="52" rx="13" fill="#111111"/>
      <text x="212" y="33" text-anchor="middle" fill="#f3ede4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">REDUX</text>

      <rect x="292" y="0" width="132" height="52" rx="13" fill="#111111"/>
      <text x="358" y="33" text-anchor="middle" fill="#f3ede4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">NODE</text>

      <rect x="438" y="0" width="132" height="52" rx="13" fill="#111111"/>
      <text x="504" y="33" text-anchor="middle" fill="#f3ede4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">EXPRESS</text>

      <rect x="584" y="0" width="132" height="52" rx="13" fill="#111111"/>
      <text x="650" y="33" text-anchor="middle" fill="#f3ede4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">MONGODB</text>
    </g>
  </g>

  <!-- Right: product-led visual, deliberately illustrative and self-contained -->
  <g transform="translate(1160 425) rotate(13)" filter="url(#shadow)">
    <rect x="-92" y="-318" width="184" height="76" rx="18" fill="#0a0908"/>
    <rect x="-112" y="-258" width="224" height="500" rx="74" fill="url(#sauce)" stroke="#442017" stroke-width="5"/>
    <rect x="-116" y="-58" width="232" height="228" rx="24" fill="#111111"/>
    <rect x="-92" y="-31" width="184" height="174" rx="12" fill="#171310" stroke="#5a4639" stroke-width="2"/>

    <text x="0" y="24" text-anchor="middle" fill="#f3ede4" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Narrow', sans-serif" font-size="36" font-weight="900" letter-spacing="2">BURNSVILLE</text>
    <g transform="translate(-64 43)">
      <rect x="0" y="11" width="39" height="3" fill="#d2282b"/>
      <text x="64" y="18" text-anchor="middle" fill="#d2282b" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Narrow', sans-serif" font-size="12" font-weight="900" letter-spacing="3">HOT SAUCE</text>
      <rect x="90" y="11" width="39" height="3" fill="#d2282b"/>
    </g>
    <text x="0" y="94" text-anchor="middle" fill="#f3ede4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="3">RED EMBER</text>
    <text x="0" y="122" text-anchor="middle" fill="#a99788" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">04 · CORE</text>
  </g>

  <!-- restrained product accents -->
  <g opacity="0.95">
    <circle cx="950" cy="756" r="22" fill="#7fa52b"/>
    <circle cx="1002" cy="756" r="22" fill="#e28a18"/>
    <circle cx="1054" cy="756" r="22" fill="#278b8d"/>
    <circle cx="1106" cy="756" r="22" fill="#a52570"/>
    <circle cx="1158" cy="756" r="22" fill="#59276f"/>
    <circle cx="1210" cy="756" r="22" fill="#2875a6"/>
    <circle cx="1262" cy="756" r="22" fill="#d52868"/>
    <circle cx="1314" cy="756" r="22" fill="#a6261c"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="862" y="817" fill="#f3ede4" font-size="18" font-weight="800" letter-spacing="2">FULL-STACK MERN ECOMMERCE</text>
    <text x="862" y="851" fill="#a99788" font-size="16">burnsville-current.vercel.app</text>

    <text x="1392" y="812" text-anchor="end" fill="#a99788" font-size="14" font-weight="800" letter-spacing="2">ORIGINAL REPO</text>
    <text x="1392" y="840" text-anchor="end" fill="#f3ede4" font-size="20" font-weight="800">27 OCT 2020</text>

    <text x="1530" y="812" text-anchor="end" fill="#a99788" font-size="14" font-weight="800" letter-spacing="2">FINAL RELEASE</text>
    <text x="1530" y="840" text-anchor="end" fill="#f3ede4" font-size="20" font-weight="800">23 SEP 2026</text>
  </g>
</svg>